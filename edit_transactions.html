<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chỉnh sửa giao dịch</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 20px; background: #f3f6fa; color: #182638; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 1100px; margin: auto; }
    a { color: #2459ce; }
    section { background: white; border: 1px solid #dce3ed; border-radius: 12px; padding: 24px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e5eaf1; }
    th { background: #f5f7fb; }
    td { overflow-wrap: anywhere; }
    .amount { text-align: right; white-space: nowrap; }
    .income { color: #087b59; }
    .expense { color: #bc3232; }
    .muted { color: #526176; }
    nav { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 24px; }
    button { font: inherit; padding: 9px 16px; border: 0; border-radius: 6px; background: #2459ce; color: white; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    .delete-button { background: #bc3232; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    input, select { font: inherit; padding: 8px; border: 1px solid #bcc8d7; border-radius: 6px; width: 150px; }
  </style>
</head>
<body>
  <main>
    <a href="/">← Về trang chủ</a>
    <h1>Chỉnh sửa giao dịch</h1>
    <p class="muted">10 giao dịch mỗi trang, sắp xếp theo ngày mới nhất.</p>
    <section aria-label="Danh sách giao dịch">
      <p id="status" class="muted" role="status">Đang tải…</p>
      <div class="table-wrap">
        <table>
          <thead><tr><th scope="col">ID</th><th scope="col">Ngày</th><th scope="col">Danh mục</th><th scope="col">Loại</th><th scope="col" class="amount">Số tiền</th><th scope="col">Ghi chú</th><th scope="col">Thao tác</th></tr></thead>
          <tbody id="transactions-body"></tbody>
        </table>
      </div>
      <nav aria-label="Phân trang giao dịch">
        <button id="previous" type="button" disabled>Trang trước</button>
        <span id="page-info" aria-live="polite"></span>
        <button id="next" type="button" disabled>Trang sau</button>
      </nav>
    </section>
  </main>
  <script>
    const money = new Intl.NumberFormat("vi-VN", { style: "currency", currency: "VND" });
    const dateFormat = new Intl.DateTimeFormat("vi-VN", { timeZone: "Asia/Ho_Chi_Minh" });
    const previous = document.getElementById("previous");
    const next = document.getElementById("next");
    let currentPage = 1;

    function formatDate(value) {
      if (!value) return "—";
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? value : dateFormat.format(date);
    }

    async function loadTransactions(page) {
      const status = document.getElementById("status");
      previous.disabled = true;
      next.disabled = true;
      status.textContent = "Đang tải…";
      try {
        const response = await fetch(`/api/transactions?page=${page}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Không thể tải giao dịch.");
        if (page > Math.max(1, data.total_pages)) {
          return await loadTransactions(Math.max(1, data.total_pages));
        }
        const tbody = document.getElementById("transactions-body");
        tbody.replaceChildren();
        for (const transaction of data.transactions) {
          const row = document.createElement("tr");
          const values = [transaction.id, formatDate(transaction.date),
            transaction.category_id == null ? "Chưa phân loại" : (transaction.category_name ?? "—"),
            transaction.coefficient === 1 ? "Thu nhập" : "Chi tiêu",
            money.format(transaction.amount), transaction.note || "—"];
          values.forEach((value, index) => {
            const cell = document.createElement("td");
            cell.textContent = value;
            if (index === 4) cell.className = `amount ${transaction.coefficient === 1 ? "income" : "expense"}`;
            row.appendChild(cell);
          });
          const actions = document.createElement("td");
          const controls = document.createElement("div");
          controls.className = "actions";
          const editButton = document.createElement("button");
          editButton.type = "button";
          editButton.textContent = "Edit";
          const saveButton = document.createElement("button");
          saveButton.type = "button";
          saveButton.textContent = "Save";
          saveButton.hidden = true;
          const cancelButton = document.createElement("button");
          cancelButton.type = "button";
          cancelButton.textContent = "Hủy";
          cancelButton.hidden = true;
          let fields;
          const deleteButton = document.createElement("button");
          deleteButton.type = "button";
          deleteButton.className = "delete-button";
          deleteButton.textContent = "Delete";
          function finishEditing() {
            values.forEach((value, index) => { row.children[index].textContent = value; });
            editButton.hidden = false;
            deleteButton.hidden = false;
            saveButton.hidden = true;
            cancelButton.hidden = true;
          }

          editButton.addEventListener("click", async () => {
            editButton.disabled = true;
            deleteButton.disabled = true;
            try {
              const response = await fetch("/api/categories");
              const categories = await response.json();
              if (!response.ok || !Array.isArray(categories)) throw new Error("Không thể tải danh mục.");
              fields = {};
              for (const [name, type] of [["date", "date"], ["amount", "number"], ["note", "text"]]) {
                const input = document.createElement("input");
                input.type = type;
                input.name = name;
                input.setAttribute("aria-label", `${name} giao dịch #${transaction.id}`);
                input.required = name !== "note";
                if (name === "amount") input.step = "any";
                input.value = transaction[name] ?? "";
                fields[name] = input;
              }
              const parsedDate = new Date(transaction.date);
              if (transaction.date && !Number.isNaN(parsedDate.getTime())) {
                const parts = new Intl.DateTimeFormat("en-US", {
                  timeZone: "Asia/Ho_Chi_Minh", year: "numeric", month: "2-digit", day: "2-digit",
                }).formatToParts(parsedDate);
                fields.date.value = ["year", "month", "day"].map(type => parts.find(part => part.type === type).value).join("-");
              }
              fields.category_id = document.createElement("select");
              fields.category_id.setAttribute("aria-label", `Danh mục giao dịch #${transaction.id}`);
              fields.category_id.add(new Option("Chưa phân loại", "null"));
              for (const category of categories) fields.category_id.add(new Option(category.name ?? "—", category.category_id));
              fields.category_id.value = transaction.category_id == null ? "null" : String(transaction.category_id);
              if (fields.category_id.selectedIndex < 0) fields.category_id.value = "null";
              fields.coefficient = document.createElement("select");
              fields.coefficient.setAttribute("aria-label", `Loại giao dịch #${transaction.id}`);
              fields.coefficient.add(new Option("Chi tiêu", "-1"));
              fields.coefficient.add(new Option("Thu nhập", "1"));
              fields.coefficient.value = String(transaction.coefficient);
              ["date", "category_id", "coefficient", "amount", "note"].forEach((name, index) => {
                row.children[index + 1].replaceChildren(fields[name]);
              });
              editButton.hidden = true;
              deleteButton.hidden = true;
              saveButton.hidden = false;
              cancelButton.hidden = false;
              fields.date.focus();
            } catch (error) {
              window.alert(error.message);
            } finally {
              editButton.disabled = false;
              deleteButton.disabled = false;
            }
          });
          cancelButton.addEventListener("click", finishEditing);
          saveButton.addEventListener("click", async () => {
            if (!Object.values(fields).every(field => field.reportValidity())) return;
            if (!window.confirm(`Bạn có chắc muốn lưu thay đổi giao dịch #${transaction.id}?`)) return;
            const payload = {
              id: transaction.id,
              date: fields.date.value,
              category_id: fields.category_id.value === "null" ? null : Number(fields.category_id.value),
              amount: Number(fields.amount.value),
              note: fields.note.value,
              coefficient: Number(fields.coefficient.value),
            };
            saveButton.disabled = true;
            cancelButton.disabled = true;
            Object.values(fields).forEach(field => { field.disabled = true; });
            try {
              const response = await fetch("/api/transactions", {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
              });
              const result = await response.json();
              if (!response.ok) throw new Error(result.error || "Không thể cập nhật giao dịch.");
              await loadTransactions(currentPage);
            } catch (error) {
              window.alert(error.message);
            } finally {
              saveButton.disabled = false;
              cancelButton.disabled = false;
              Object.values(fields).forEach(field => { field.disabled = false; });
            }
          });
          deleteButton.addEventListener("click", async () => {
            if (!window.confirm(`Bạn có chắc muốn xóa giao dịch #${transaction.id} với số tiền ${money.format(transaction.amount)}?`)) return;
            deleteButton.disabled = true;
            editButton.disabled = true;
            try {
              const response = await fetch("/api/transactions", {
                method: "DELETE",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id: transaction.id }),
              });
              const result = await response.json();
              if (!response.ok) throw new Error(result.error || "Không thể xóa giao dịch.");
              await loadTransactions(currentPage);
            } catch (error) {
              window.alert(error.message);
            } finally {
              deleteButton.disabled = false;
              editButton.disabled = false;
            }
          });
          controls.append(editButton, saveButton, cancelButton, deleteButton);
          actions.appendChild(controls);
          row.appendChild(actions);
          tbody.appendChild(row);
        }
        currentPage = data.page;
        const url = new URL(window.location.href);
        url.searchParams.set("page", currentPage);
        window.history.replaceState(null, "", url);
        document.getElementById("page-info").textContent = `Trang ${currentPage} / ${Math.max(1, data.total_pages)}`;
        status.textContent = data.total ? `Tổng cộng ${data.total} giao dịch.` : "Chưa có giao dịch nào.";
        previous.disabled = currentPage <= 1;
        next.disabled = currentPage >= data.total_pages;
      } catch (error) {
        status.textContent = `${error.message} Vui lòng tải lại trang.`;
      }
    }
    previous.addEventListener("click", () => loadTransactions(currentPage - 1));
    next.addEventListener("click", () => loadTransactions(currentPage + 1));
    const initialPage = Number(new URLSearchParams(window.location.search).get("page") || 1);
    loadTransactions(Number.isSafeInteger(initialPage) && initialPage > 0 ? initialPage : 1);
  </script>
</body>
</html>
